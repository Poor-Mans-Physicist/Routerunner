[package]
name = "routerunner_lane"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "routerunner_lane"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "lane_cli"
path = "src/main.rs"

[dependencies]
jni = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
