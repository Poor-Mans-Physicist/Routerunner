name: natives

# Builds the Rust lane planner (native/lane) for Linux and macOS. The mod itself can't be built in CI (the_vault and
# vhapi jars are not redistributable), so the jar is still assembled locally: download this run's artifacts into
# native/lane/dist/ (see native/lane/README.md) and run gradlew build.

on:
  workflow_dispatch:
  push:
    paths:
      - 'native/lane/**'
      - '.github/workflows/natives.yml'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            lib: librouterunner_lane.so
          - platform: linux-arm64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            lib: librouterunner_lane.so
          - platform: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
            lib: librouterunner_lane.dylib
          - platform: macos-x64
            os: macos-14
            target: x86_64-apple-darwin
            lib: librouterunner_lane.dylib
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        working-directory: native/lane
        run: cargo build --release --lib --target ${{ matrix.target }}
      - name: Stage
        run: |
          mkdir -p dist/${{ matrix.platform }}
          cp native/lane/target/${{ matrix.target }}/release/${{ matrix.lib }} dist/${{ matrix.platform }}/
      - uses: actions/upload-artifact@v4
        with:
          name: natives-${{ matrix.platform }}
          path: dist/${{ matrix.platform }}/${{ matrix.lib }}
          if-no-files-found: error
